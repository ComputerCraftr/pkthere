[tool.pkthere.ci-tools]
actionlint_image = "rhysd/actionlint:1.7.12"
cross_revision = "1d07d3f9cc465c435256f1aabc1d18024517891a"
mypy = "2.3.0"
miri_toolchain = "nightly-2026-07-28"
pipx = "1.16.5"
prettier = "3.9.6"
ruff = "0.16.1"
shfmt_image = "mvdan/shfmt:v3.13.1-alpine"
taplo_cli = "0.10.0"
yamllint = "1.38.0"

[tool.ruff]
extend-exclude = [".artifacts", "cross-artifacts", "docker-artifacts", "target"]
target-version = "py313"

[tool.mypy]
exclude = ["^\\.artifacts/", "^cross-artifacts/", "^docker-artifacts/", "^target/"]
files = ["ci", "docker"]
python_version = "3.13"
strict = true
