include = ["**/*.toml"]
exclude = [
  "target/**",
  "vendor/**",
  "generated/**",
  ".artifacts/**",
  "cross-artifacts/**",
  "docker-artifacts/**",
  "macos-profile-artifacts/**",
]

[formatting]
allowed_blank_lines = 1
array_trailing_comma = true
column_width = 100
compact_arrays = true
reorder_keys = false
