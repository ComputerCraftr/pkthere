[package]
name = "pkthere"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[features]
authority-audit = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
pkthere-test-support = { path = "tests/support" }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde_yaml_ng = "0.10.0"
syn = { version = "3.0.3", features = ["full", "parsing", "visit", "visit-mut"] }
toml = "1.1.4"

[target.'cfg(not(target_env = "musl"))'.dev-dependencies]
loom = "0.7.2"

[workspace]
members = [".", "tests/support", "crates/wire", "crates/socket_policy"]
resolver = "3"

[workspace.package]
rust-version = "1.97"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = 0
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = "limited"
strip = "none"
split-debuginfo = "packed"

[profile.release-debug]
inherits = "release"
opt-level = 3
debug = "limited"
strip = "none"
debug-assertions = true
overflow-checks = true
panic = "unwind"
lto = false
codegen-units = 16
incremental = false

[dependencies]
crossbeam-channel = "0.5.16"
crossbeam-queue = "0.3.13"
ctrlc = { version = "3.5.2", features = ["termination"] }
getrandom = "0.4.3"
pkthere-socket-policy = { path = "crates/socket_policy" }
pkthere-wire = { path = "crates/wire" }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
nix = { version = "0.31.3", features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Networking_WinSock",
  "Win32_System_Threading",
] }
