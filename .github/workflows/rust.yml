name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Formatting, Lints, and Types
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned quality tools
        run: >-
          python -m ci.pkthere_ci bootstrap-quality-tools
          --log quality-bootstrap.log

      - name: Run canonical quality command plan
        run: >-
          python -m ci.pkthere_ci quality
          --log quality.log

  authority-audit:
    name: Authority Graph and Loom Negative Controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: authority-audit

      - uses: ./.github/actions/enable_icmp_ping

      - name: Run allowlisted negative controls and positive authority suite
        run: >-
          python -m ci.pkthere_ci authority-audit
          --log authority-audit.log

  msrv:
    name: Rust 1.97.1 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust 1.97.1
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.97.1

      - uses: ./.github/actions/enable_icmp_ping

      - name: Run canonical MSRV command plan
        run: >-
          python -m ci.pkthere_ci msrv
          --log msrv.log

  macos-profile:
    name: macOS Time Profiler Artifact
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-profile-portable

      - name: Build and verify portable profiling artifact
        run: >-
          python -m ci.pkthere_ci macos-profile
          --cpu-policy portable
          --log macos-profile.log

      - name: Upload macOS profiling evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-profile-portable
          path: |
            macos-profile.log
            macos-profile-artifacts
            target/macos_profile
          if-no-files-found: error

  miri-production-units:
    name: Miri production unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Resolve pinned CI tool versions
        id: ci-tools
        run: >-
          python -m ci.pkthere_ci ci-tool-outputs
          --log ci-tool-outputs.log

      - name: Set up pinned nightly Miri
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ steps.ci-tools.outputs.miri_toolchain }}
          components: miri

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri-production-units

      - name: Run targeted Miri boundary tests
        run: >-
          python -m ci.pkthere_ci miri-boundaries
          --log miri-boundaries.log

  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            app_source: target/debug/pkthere
            test_app: target/debug/pkthere-priv
          - os: macos-latest
            app_source: target/debug/pkthere
            test_app: target/debug/pkthere-priv
          - os: windows-latest
            app_source: target/debug/pkthere.exe
            test_app: target/debug/pkthere-priv.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/enable_icmp_ping

      - name: Run canonical native platform lifecycle
        run: >-
          python -m ci.pkthere_ci platform-ci
          --app-bin "${{ matrix.app_source }}"
          --privileged-app-bin "${{ matrix.test_app }}"
          --log native-platform-${{ matrix.os }}.log

      - name: Upload native socket reality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: |
            native-platform-*.log
            ${{ matrix.app_source }}
          if-no-files-found: warn

  stress-release:
    name: Release Stress (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/enable_icmp_ping

      - name: Run canonical release stress command plan
        run: >-
          python -m ci.pkthere_ci release-stress
          --log release-stress.log

  aarch64-musl:
    name: Portable aarch64 musl artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: aarch64-musl-cross

      - name: Run canonical AArch64 musl artifact plan
        run: >-
          python -m ci.pkthere_ci aarch64-musl
          --log cross-artifacts/aarch64-musl.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: aarch64-musl
          path: |
            cross-artifacts
            target/aarch64-unknown-linux-musl/release
          if-no-files-found: error

  alpine-socket-reality:
    name: Alpine Privileged Socket Reality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: alpine-musl

      - uses: ./.github/actions/enable_icmp_ping

      - name: Run canonical x86_64 musl artifact plan
        run: >-
          python -m ci.pkthere_ci alpine-build
          --log docker-artifacts/alpine-build.log

      - uses: docker/setup-buildx-action@v4

      - name: Build Alpine reality image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/alpine/Dockerfile
          load: true
          network: host
          tags: pkthere-alpine-reality
          cache-from: type=gha,scope=alpine-reality
          cache-to: type=gha,mode=max,scope=alpine-reality

      - name: Run privileged Alpine profiles
        run: >-
          python -m ci.pkthere_ci alpine-runtime
          --log docker-artifacts/alpine-runtime.log

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpine
          path: docker-artifacts
          if-no-files-found: error

  freebsd:
    name: FreeBSD ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_HOME: .freebsd-cache/${{ matrix.release }}/cargo-home
      CARGO_TARGET_DIR: .freebsd-cache/${{ matrix.release }}/target
      PKTHERE_AUTHORITY_TARGET_DIR: .freebsd-cache/${{ matrix.release }}/authority-target
    strategy:
      fail-fast: false
      matrix:
        release: ["14.4", "15.1"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Restore FreeBSD Cargo cache
        id: freebsd-cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: .freebsd-cache/${{ matrix.release }}
          key: >-
            freebsd-${{ matrix.release }}-rust-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            freebsd-${{ matrix.release }}-rust-v1-${{ hashFiles('Cargo.lock') }}-
            freebsd-${{ matrix.release }}-rust-v1-

      - name: Run canonical FreeBSD platform lifecycle
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ matrix.release }}
          sync: rsync
          copyback: true
          cache-after-prepare: true
          envs: CARGO_HOME CARGO_TARGET_DIR PKTHERE_AUTHORITY_TARGET_DIR
          prepare: /bin/sh .github/scripts/prepare_freebsd_ci.sh v1
          run: >-
            python3.13 -m ci.pkthere_ci platform-ci-vm
            --log freebsd-${{ matrix.release }}.log
            --result freebsd-${{ matrix.release }}.result.json

      - name: Save FreeBSD Cargo cache
        if: always() && steps.freebsd-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .freebsd-cache/${{ matrix.release }}
          key: >-
            freebsd-${{ matrix.release }}-rust-v1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}

      - name: Upload FreeBSD socket reality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-${{ matrix.release }}
          path: |
            freebsd-${{ matrix.release }}.log
            freebsd-${{ matrix.release }}.result.json
          if-no-files-found: error

      - name: Verify canonical FreeBSD platform result
        if: always()
        run: >-
          python3 -m ci.pkthere_ci platform-ci-result
          --log freebsd-${{ matrix.release }}-result-check.log
          --result freebsd-${{ matrix.release }}.result.json
